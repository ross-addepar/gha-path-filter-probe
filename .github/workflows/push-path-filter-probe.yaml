name: Push path-filter probe (with paths)

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect push payload and changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_CREATED: ${{ github.event.created || false }}
        run: |
          set -uo pipefail

          null_sha=0000000000000000000000000000000000000000

          echo "event name: $GITHUB_EVENT_NAME"
          echo "ref: $GITHUB_REF"
          echo "created: $REF_CREATED"
          echo "before: $BASE_SHA"
          echo "after: $HEAD_SHA"
          echo
          echo "Selected raw payload fields:"
          jq '{
            created,
            before,
            after,
            ref,
            deleted,
            forced,
            compare,
            commits: [.commits[] | {id, added, modified, removed}]
          }' "$GITHUB_EVENT_PATH"
          echo

          changed_files=""
          if [ "$REF_CREATED" != true ]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          echo "Changed files (empty for a created ref):"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files"
          else
            echo "<empty>"
          fi
          echo "Changed-files value is empty: $([ -z "$changed_files" ] && echo true || echo false)"
          echo

          echo "Files changed by commits in the push payload:"
          mapfile -t pushed_commits < <(jq -r '.commits[].id' "$GITHUB_EVENT_PATH")
          if [ "${#pushed_commits[@]}" -gt 0 ]; then
            for commit in "${pushed_commits[@]}"; do
              git diff-tree --root --no-commit-id --name-status -r "$commit"
            done | sort -u
          else
            echo "<empty>"
          fi
          echo

          echo "Raw git diff against before -> after:"
          if diff_output="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>&1)"; then
            echo "exit: 0"
            if [ -n "$diff_output" ]; then
              printf '%s\n' "$diff_output"
            else
              echo "<empty>"
            fi
          else
            status=$?
            echo "exit: $status"
            printf '%s\n' "$diff_output"
          fi
          echo

          if [ "$BASE_SHA" = "$null_sha" ]; then
            echo "The before SHA is the all-zero null SHA."
            echo "Git does not have a root commit object at that SHA:"
            if git cat-file -e "$null_sha^{commit}" 2>/dev/null; then
              echo "unexpectedly present"
            else
              echo "not present"
            fi
          fi
